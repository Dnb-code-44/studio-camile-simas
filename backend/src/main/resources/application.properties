# ── Servidor ─────────────────────────────────────────────────
server.port=8080

# ── Aplicação ─────────────────────────────────────────────────
spring.application.name=studio-camile-simas-api

# ── CORS — origem permitida do frontend (Vite dev server) ─────
# Em produção, troque pela URL real do seu domínio.
app.cors.allowed-origins=http://localhost:5173,http://localhost:4173

# ── WhatsApp (número configurável sem re-build) ───────────────
app.whatsapp.number=5511999999999

# ── Actuator ─────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ── Logging ───────────────────────────────────────────────────
logging.level.com.studiocamilesimas=DEBUG
